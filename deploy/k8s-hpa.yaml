# Kubernetes Horizontal Auto-Scaling Blueprint (2 -> 200+ Pods behind Load Balancer)
# Apply with: kubectl apply -f deploy/k8s-hpa.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxelcraft-redis
  labels:
    app: voxelcraft-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voxelcraft-redis
  template:
    metadata:
      labels:
        app: voxelcraft-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: voxelcraft-redis
spec:
  selector:
    app: voxelcraft-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxelcraft-game-node
  labels:
    app: voxelcraft-game-node
spec:
  replicas: 4
  selector:
    matchLabels:
      app: voxelcraft-game-node
  template:
    metadata:
      labels:
        app: voxelcraft-game-node
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: game-node
          image: voxelcraft-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: REDIS_URL
              value: "redis://voxelcraft-redis:6379"
            - name: SHARD_PLAYER_CAP
              value: "160"
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: voxelcraft-lb
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: voxelcraft-game-node
  ports:
    - name: http-ws
      port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voxelcraft-game-node-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voxelcraft-game-node
  minReplicas: 2
  maxReplicas: 250
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voxelcraft-game-node-pdb
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app: voxelcraft-game-node
