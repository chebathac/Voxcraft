worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 32768;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  # WebSocket upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Consistent-hash routing by room code + client IP keeps players in the same
  # map shard pinned to warm nodes while failing over cleanly if a pod drains.
  upstream voxel_game_nodes {
    hash $arg_room$remote_addr consistent;
    server game-node:3000 max_fails=3 fail_timeout=10s;
    keepalive 256;
  }

  # Basic per-IP connection/request burst guard at the edge
  limit_req_zone $binary_remote_addr zone=api_limit:20m rate=40r/s;

  server {
    listen 80;
    server_name _;

    # Health check for upstream cloud L4/L7 load balancers
    location = /healthz {
      proxy_pass http://voxel_game_nodes/healthz;
      proxy_http_version 1.1;
      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
    }

    location = /readyz {
      proxy_pass http://voxel_game_nodes/readyz;
      proxy_http_version 1.1;
      proxy_connect_timeout 2s;
      proxy_read_timeout 2s;
    }

    # Long-lived WebSocket multiplayer endpoint (/ws?room=...)
    location /ws {
      proxy_pass http://voxel_game_nodes;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # REST API + HTTP hybrid sync fallback
    location /api/ {
      limit_req zone=api_limit burst=80 nodelay;
      proxy_pass http://voxel_game_nodes;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static SPA & bundled game assets
    location / {
      proxy_pass http://voxel_game_nodes;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
